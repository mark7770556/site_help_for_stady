
<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ institution.name }}</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            background: #f8f8f5;

            color: #222;

        }


        /* ================= HEADER ================= */

        .header {

            height: 80px;

            background: white;

            border-bottom: 1px solid #e5e5e5;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 50px;

        }


        .logo {

            font-size: 24px;

            font-weight: 700;

            letter-spacing: 1px;

        }


        .back-button {

            text-decoration: none;

            color: #555;

            font-size: 16px;

            padding: 10px 18px;

            border-radius: 8px;

            transition: background 0.2s ease;

        }


        .back-button:hover {

            background: #eeeeee;

        }


        /* ================= MAIN ================= */

        .main {

            max-width: 1200px;

            margin: 0 auto;

            padding: 60px 40px;

        }


        /* ================= CARD ================= */

        .institution-card {

            background: white;

            border-radius: 20px;

            padding: 45px;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.05);

        }


        /* ================= TITLE ================= */

        .institution-name {

            font-size: 40px;

            font-weight: 600;

            line-height: 1.2;

            margin-bottom: 15px;

        }


        .institution-type {

            display: inline-block;

            background: #e7e7e7;

            color: #555;

            padding: 8px 15px;

            border-radius: 20px;

            font-size: 14px;

            margin-bottom: 35px;

        }


        /* ================= DESCRIPTION ================= */

        .description-title {

            font-size: 22px;

            margin-bottom: 12px;

        }


        .description {

            color: #666;

            font-size: 17px;

            line-height: 1.7;

            max-width: 850px;

            margin-bottom: 40px;

        }


        /* ================= INFO ================= */

        .info {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;

            margin-top: 20px;

        }


        .info-item {

            background: #f5f5f3;

            border-radius: 12px;

            padding: 22px;

        }


        .info-label {

            display: block;

            font-size: 14px;

            color: #888;

            margin-bottom: 8px;

        }


        .info-value {

            font-size: 17px;

            color: #333;

        }


        /* ================= WEBSITE ================= */

        .website {

            color: #333;

            text-decoration: none;

        }


        .website:hover {

            text-decoration: underline;

        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 700px) {

            .header {

                padding: 0 25px;

            }


            .main {

                padding: 30px 20px;

            }


            .institution-card {

                padding: 30px 25px;

            }


            .institution-name {

                font-size: 30px;

            }


            .info {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

    <div class="logo">

        Учебное заведение 

    </div>


    <a
        href="javascript:history.back()"
        class="back-button"
    >

        ← Назад

    </a>

</header>



<!-- ================= MAIN ================= -->

<main class="main">


    <div class="institution-card">


        <!-- НАЗВАНИЕ -->

        <h1 class="institution-name">

            {{ institution.name }}

        </h1>


        <!-- ТИП -->

        <div class="institution-type">

            {{ institution.type }}

        </div>



        <!-- ОПИСАНИЕ -->

        <h2 class="description-title">

            Об учебном заведении

        </h2>


        <p class="description">

            {{ institution.description }}

        </p>



        <!-- ИНФОРМАЦИЯ -->

        <div class="info">


            <!-- АДРЕС -->

            <div class="info-item">

                <span class="info-label">

                    Адрес

                </span>


                <div class="info-value">

                    {{ institution.adress }}

                </div>

            </div>



            <!-- ГОРОД -->

            <div class="info-item">

                <span class="info-label">

                    Город

                </span>


                <div class="info-value">

                    {{ institution.city.name }}

                </div>

            </div>



            <!-- ТИП -->

            <div class="info-item">

                <span class="info-label">

                    Тип учебного заведения

                </span>


                <div class="info-value">

                    {{ institution.type }}

                </div>

            </div>



            <!-- САЙТ -->

            <div class="info-item">

                <span class="info-label">

                    Официальный сайт

                </span>


                <div class="info-value">

                    <a
                        href="{{ institution.website }}"
                        target="_blank"
                        class="website"
                    >

                        {{ institution.website }}

                    </a>

                </div>

            </div>


        </div>


    </div>


</main>


</body>

</html>
```
